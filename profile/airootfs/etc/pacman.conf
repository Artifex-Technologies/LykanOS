#
# /etc/pacman.conf of LykanOS (the live medium and the installed system; the ISO itself is built with profile/pacman.conf)
#
# Arch's own repositories, plus [labyrinth]: the desktop (Yggdrasil), Heimdall and Limbo come from Labyrinth OS's signed package
# repository, so desktop updates reach LykanOS the same day they reach Labyrinth. Its key is in pacman's keyring through the
# labyrinth-keyring package (pacman-init.service on the live medium, lykanos-install-cleanup on the installed system).
#
# [blackarch] is not listed: the keyring (blackarch-keyring) is installed so it can be trusted, and adding the repository is
# a choice made after installing (with blackarch-mirrorlist). See docs/ARCHITECTURE.md.

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[labyrinth]
SigLevel = Required
Server = https://github.com/Artifex-Technologies/Labyrinth_OS/releases/download/packages

# The LykanOS tools (lykan-webaudit and the ones that follow): LykanOS's own
# signed package repository, built from the private LykanOS-Tools repo and
# published to the "packages" release of this public repo. Signed with the same
# Labyrinth key, which labyrinth-keyring already trusts, so nothing new is
# trusted for it. Last. See docs/TOOLS.md.
[lykanos]
SigLevel = Required
Server = https://github.com/Artifex-Technologies/LykanOS/releases/download/packages
