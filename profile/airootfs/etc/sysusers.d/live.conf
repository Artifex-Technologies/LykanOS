# Live-session user.
#
# Created via sysusers.d rather than by shipping airootfs/etc/passwd the way
# archiso's releng profile does: mkarchiso copies airootfs over the pacstrapped
# root and does NOT re-run systemd-sysusers, so a hand-written passwd would
# delete every service account the image already has -- including greetd's
# greeter, which would break the login screen. systemd-sysusers.service runs at
# boot, before sysinit.target, so the account exists well before greetd starts.
u live 1000 "Niflheim Live Session" /home/live /usr/bin/bash
m live wheel
m live video
m live audio
m live input
