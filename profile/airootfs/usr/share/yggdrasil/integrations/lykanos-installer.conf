# LykanOS installs through Yggdrasil's installer window and its install program (yggdrasil-install-system, in the
# yggdrasil-installer package; Yggdrasil's docs/INSTALLER.md), the same program Labyrinth OS uses. What is LykanOS's:
kind = installer
command = /usr/bin/yggdrasil-install-system
name = LykanOS
# run inside the new system first: takes away the live account, its sign-in and no-password rules, puts the kernel and the
# start-up preset back, sets up pacman's keyring
cleanup = /usr/local/bin/lykanos-install-cleanup
reserved_logins = heimdall sarina
# the account's groups (those the system has): wireshark lets it capture without root
groups = users lp video network storage wheel audio kvm wireshark
