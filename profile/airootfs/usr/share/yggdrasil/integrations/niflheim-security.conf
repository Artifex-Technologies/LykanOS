# Heimdall, the security monitor, in the desktop (Yggdrasil's docs/INTEGRATIONS.md, kind "security"): its alerts in the panel
# and Settings, contained programs and held files, and Wi-Fi & Network > Devices and Wi-Fi checks (Heimdall's docs/DEVICES.md and
# docs/WIFI_HEALTH.md; starting the scan needs no password, polkit rule 50-heimdall-lan-scan.rules).
kind = security
name = Heimdall
api = http://127.0.0.1:8930
contained = /etc/heimdall/contained
release = /usr/bin/heimdalld contain release
held_release = /usr/bin/heimdalld immunity release
held_confirm = /usr/bin/heimdalld immunity confirm
devices_scan = /usr/bin/systemctl start heimdall-lan-scan.service
wifi_check = /usr/bin/heimdalld wifi-health --json
