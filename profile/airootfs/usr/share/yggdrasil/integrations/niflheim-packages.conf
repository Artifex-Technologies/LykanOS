# Niflheim's own software in Agora, the desktop's app store (Yggdrasil's docs/INTEGRATIONS.md, kind "packages"). The catalog
# lists what only Niflheim offers; its packages come from the [labyrinth] repository in /etc/pacman.conf.
kind = packages
name = Niflheim
catalog = /usr/share/niflheim/agora/catalog.json
edition = niflheim
