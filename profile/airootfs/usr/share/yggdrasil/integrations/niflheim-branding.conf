# Niflheim's look inside Yggdrasil (Yggdrasil's docs/INTEGRATIONS.md, kind "branding"). The OS name and logo come from
# /etc/os-release (NAME, LOGO = niflheimos, the icon made by scripts/gen-logo.py). Deep teal green, decided 2026-11-07 from a
# reference picture: #101c1c at the edges, #24413c in the middle, #437569 the glow (the accent; white text reads on it).
kind = branding
accent = #437569
wallpaper = /usr/share/wallpapers/niflheim/niflheim-green.png
# the logo on the screen after signing in (Yggdrasil's yggdrasil-splash)
splash_logo = /usr/share/niflheim/logo/niflheim-splash.png
