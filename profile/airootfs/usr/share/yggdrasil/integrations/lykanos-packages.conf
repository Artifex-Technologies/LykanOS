# LykanOS's own software in Agora, the desktop's app store (Yggdrasil's docs/INTEGRATIONS.md, kind "packages"). The catalog
# lists what only LykanOS offers; its packages come from the [labyrinth] repository in /etc/pacman.conf.
kind = packages
name = LykanOS
catalog = /usr/share/lykanos/agora/catalog.json
edition = lykanos
