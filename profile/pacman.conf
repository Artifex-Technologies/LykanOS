#
# /etc/pacman.conf for building the LykanOS ISO
#
# Based on archiso's releng profile (archlinux/archiso configs/releng/pacman.conf),
# plus the [blackarch] and [labyrinth] repos.
#
# NOTE: this file is consumed by mkarchiso running on the BUILD HOST, using
# the host's own pacman keyring. Before building, the host needs:
#   1. The BlackArch signing key + mirrorlist installed (see scripts/build.sh,
#      which runs BlackArch's official strap.sh for this).
#   2. The Labyrinth signing key in its keyring (scripts/build.sh adds it by
#      its full fingerprint).

[options]
HoldPkg     = pacman glibc
Architecture = auto

ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# REPOSITORIES
#

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Multilib (32-bit packages). Several BlackArch tools (e.g. yinjector,
# limelighter, thefatrat) depend on lib32-* packages, so this needs to be
# enabled rather than optional once BlackArch categories are in the mix.
[multilib]
Include = /etc/pacman.d/mirrorlist

# BlackArch tooling. Installed by scripts/build.sh via BlackArch's strap.sh
# before mkarchiso runs, which writes the matching mirrorlist to
# /etc/pacman.d/blackarch-mirrorlist on the build host.
[blackarch]
SigLevel = PackageRequired
Include = /etc/pacman.d/blackarch-mirrorlist

# The desktop (Yggdrasil), Sarina, Heimdall and Limbo: Labyrinth OS's signed
# package repository, the same packages Labyrinth installs (Labyrinth's
# docs/PACKAGE_REPO.md), built for any 64-bit CPU. Last.
[labyrinth]
SigLevel = Required
Server = https://github.com/Artifex-Technologies/Labyrinth_OS/releases/download/packages
