name: Tools

on:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "tools/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: fmt, clippy and the tests of LykanOS's programs
        working-directory: tools
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked
